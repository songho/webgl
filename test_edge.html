<script type="text/javascript">

// global vars
let gl = null;

// constants
const CAMERA_Z = 10;
const EDGE_ANGLE = 90;



///////////////////////////////////////////////////////////////////////////////
// main entry point
///////////////////////////////////////////////////////////////////////////////
document.addEventListener("DOMContentLoaded", () =>
{
    let success = initWebGL("webglView");
    if(!success)
        return;

    initHtml();
});



///////////////////////////////////////////////////////////////////////////////
// init WebGL
///////////////////////////////////////////////////////////////////////////////
function initWebGL(canvasId)
{
    try{

    let canvas = document.getElementById(canvasId);
    if(!isWebGLSupported())
    {
        let node = canvas.parentNode;
        let message = "This page requires WebGL enabled browser.<br/>" +
                      "<a href='http://get.webgl.org'>Click here to upgrade your browser.</a>";
        node.innerHTML = "<div style='width:100%; height:100%; text-align:center; line-height:1em; background:#fff;'>\n" +
                         message +
                         "</div>\n";

        log("[ERROR] The browser does not support WebGL.");
        return false;
    }

    // get gl context
    gl = getContextGL(canvas)
    if(!gl)
    {
        Logger.show();
        log("[ERROR] Failed to get WebGL context.");
        return false;
    }
    logWebGL(gl);

    // remember canvas
    gl.canvas = canvas;

    // init gl and glsl
    initGL(gl);
    initGLSL(gl);
    log("WebGL is initialized.");

    // init app ===============================================================

    gl.surfaceVisible = true;
    gl.outlineVisible = false;
    gl.edgeAngle = EDGE_ANGLE;

    // init edges
    gl.edges = [];
    gl.hardEdges = [];
    gl.outlineEdges = [];

    gl.obj = new ObjModel(gl);
    gl.obj.read("files/models/angle_block.obj").then(obj =>
    {
        initVBO(obj);
    }).catch(msg => { log(msg); });

    // init array of pointer objects
    gl.pointers = [];

    // register event handlers
    window.addEventListener("resize",  handleResize);
    log("Added window resize envent listener, handleResize().");
    canvas.addEventListener("click", handleClick);
    log("Added canvas click event listener, handleClick().");
    canvas.addEventListener("contextmenu", handleContextMenu);
    log("Added canvas contextmenu event listener, handleContextMenu().");
    canvas.addEventListener("wheel", handleWheel);
    log("Added canvas wheel event listeners, handleWheel()");
    // canvas pointer events
    canvas.addEventListener("pointerdown", handlePointerDown, false);
    log("Added canvas pointerdown event listeners, handlePointerDown()");
    canvas.addEventListener("pointerup", handlePointerUp, false);
    log("Added canvas pointerup event listeners, handlePointerUp()");
    canvas.addEventListener("pointermove", handlePointerMove, false);
    log("Added canvas pointermove event listeners, handlePointerMove()");
    canvas.addEventListener("pointercancel", handlePointerCancel, false);
    log("Added canvas pointercancel event listeners, handlePointerCancel()");
    canvas.addEventListener("pointerleave", handlePointerLeave, false);
    log("Added canvas pointerleave event listeners, handlePointerLeave()");

    // ready to start rendering loop
    startRendering(gl);

    }catch(e){
        log("[ERROR] " + e.message);
        alert("[ERROR] " + e.message);
    }

    return true;
}



///////////////////////////////////////////////////////////////////////////////
// print WebGL RC info
///////////////////////////////////////////////////////////////////////////////
function logWebGL(gl)
{
    log("===== WebGL Info =====");
    log("   Version: " + gl.getParameter(gl.VERSION));
    log("  GLSL Ver: " + gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
    log("    Vendor: " + gl.getParameter(gl.VENDOR));
    log("  Renderer: " + gl.getParameter(gl.RENDERER));
    log("     Color: (" + gl.getParameter(gl.RED_BITS) + ", " + gl.getParameter(gl.GREEN_BITS) + ", " + gl.getParameter(gl.BLUE_BITS) + ", " + gl.getParameter(gl.ALPHA_BITS) + ") bits");
    log("     Depth: " + gl.getParameter(gl.DEPTH_BITS) + " bits");
    log("   Stencil: " + gl.getParameter(gl.STENCIL_BITS) + " bits");
    log("Extentions: " + gl.getSupportedExtensions());
    log();
}



///////////////////////////////////////////////////////////////////////////////
// start rendering loop
///////////////////////////////////////////////////////////////////////////////
function startRendering(gl)
{
    log("\nStarting rendering loop...\n");

    // try to find "requestAnimationFrame" function
    // if it is not available use setTimeout() instead
    let requestAnimationFrame = getRequestAnimationFrameFunction(window);
    let timer = new Timer();
    gl.fps = new FrameRate("fps");
    let frameCallback = function()
    {
        gl.fps.tick();
        gl.frameTime = timer.getFrameTime();
        gl.runTime += gl.frameTime;
        frame();
        postFrame();
        requestAnimationFrame(frameCallback);
    };

    timer.start();
    gl.runTime = 0;
    requestAnimationFrame(frameCallback);
}



///////////////////////////////////////////////////////////////////////////////
// draw a single frame
///////////////////////////////////////////////////////////////////////////////
function frame()
{
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // update view matrices
    gl.matrixView.identity();
    gl.matrixView.rotateY(gl.camera.angle.y);
    gl.matrixView.rotateX(gl.camera.angle.x);
    gl.matrixView.translate(0, 0, -gl.camera.distance);
    gl.matrixView.translate(-gl.camera.target.x, -gl.camera.target.y, -gl.camera.target.z);

    drawEdges();
    drawModel();
}



///////////////////////////////////////////////////////////////////////////////
// post frame
///////////////////////////////////////////////////////////////////////////////
function postFrame()
{
}



///////////////////////////////////////////////////////////////////////////////
// draw obj
///////////////////////////////////////////////////////////////////////////////
function drawModel()
{
    gl.program = gl.shaderPrograms["phong"];
    if(!gl.program) return;
    gl.useProgram(gl.program);

    // model transform
    gl.matrixModel.identity();

    // compute modelview transform
    gl.matrixModelView = gl.matrixView.clone().multiply(gl.matrixModel);
    gl.uniformMatrix4fv(gl.program.uniform.matrixModelView, false, gl.matrixModelView.m);

    // compute normal transform
    gl.matrixNormal = gl.matrixModelView.getRotationMatrix();
    gl.uniformMatrix4fv(gl.program.uniform.matrixNormal, false, gl.matrixNormal.m);

    // compute modelviewprojection transform
    gl.matrixModelViewProjection = gl.matrixProjection.clone().multiply(gl.matrixModelView);
    gl.uniformMatrix4fv(gl.program.uniform.matrixModelViewProjection, false, gl.matrixModelViewProjection.m);

    //gl.uniform4fv(gl.program.uniform.materialDiffuse, gl.material.getDiffuse());

    if(gl.surfaceVisible && gl.vbo && gl.ibo)
    {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.vbo);
        gl.vertexAttribPointer(gl.program.attribute.vertexPosition, 3, gl.FLOAT, false, 0, 0);
        gl.vertexAttribPointer(gl.program.attribute.vertexNormal, 3, gl.FLOAT, false, 0, gl.vbo.normalOffset);

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.ibo);
        gl.drawElements(gl.TRIANGLES, gl.ibo.indexCount, gl.obj.indexType, 0);
    }
}



///////////////////////////////////////////////////////////////////////////////
// draw edge lines
///////////////////////////////////////////////////////////////////////////////
function drawEdges()
{
    gl.program = gl.shaderPrograms["flat"];
    if(!gl.program) return;
    gl.useProgram(gl.program);

    // model transform
    gl.matrixModel.identity();

    gl.uniform1i(gl.program.uniform.matrixComputed, false);
    gl.uniformMatrix4fv(gl.program.uniform.matrixModel, false, gl.matrixModel.m);
    gl.uniformMatrix4fv(gl.program.uniform.matrixView, false, gl.matrixView.m);
    gl.uniformMatrix4fv(gl.program.uniform.matrixProjection, false, gl.matrixProjection.m);

    gl.uniform4fv(gl.program.uniform.materialDiffuse, new Float32Array([0, 0, 0, 1]));

    if(gl.hardEdges && gl.hardEdges.length > 0)
    {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboHardEdge);
        gl.vertexAttribPointer(gl.program.attribute.vertexPosition, 3, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.LINES, 0, gl.vboHardEdge.count);
    }

    // display outlines
    if(gl.outlineVisible && gl.edges.length > 0)
    {
        // recalculate outline edges
        let matrix = gl.matrixView.clone().multiply(gl.matrixModel).getRotationMatrix();
        gl.outlineEdges = Edge.generateOutlineEdges(gl.edges, matrix);
        if(gl.outlineEdges.length > 0)
        {
            gl.uniform4fv(gl.program.uniform.materialDiffuse, new Float32Array([1, 0, 0, 1]));
            let vertices = Edge.toFloat32Array(gl.outlineEdges);
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboOutlineEdge);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            gl.vboOutlineEdge.count = vertices.length / 3;
            gl.vertexAttribPointer(gl.program.attribute.vertexPosition, 3, gl.FLOAT, false, 0, 0);
            gl.drawArrays(gl.LINES, 0, gl.vboOutlineEdge.count);
        }
    }
}



///////////////////////////////////////////////////////////////////////////////
// reshape OpenGL window when the canvas is resized
///////////////////////////////////////////////////////////////////////////////
function handleResize()
{
    // resize window to fit to parent
    gl.canvas.width = gl.canvas.parentNode.clientWidth;
    gl.canvas.height = gl.canvas.parentNode.clientHeight;

    gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    gl.matrixProjection = Matrix4.makePerspective(45, gl.canvas.width/gl.canvas.height, gl.nearPlane, gl.farPlane);

    log("Window is resized: " + gl.canvas.width + " x " + gl.canvas.height);
}



///////////////////////////////////////////////////////////////////////////////
// handlers for mouse event
///////////////////////////////////////////////////////////////////////////////
function handleWheel(e)
{
    // positive deltaY = wheel down
    // negative deltaY = wheel up
    if(e.deltaY != 0)
    {
        let deltaDistance = e.deltaY * gl.obj.radius * 0.01;
        gl.camera.distance += deltaDistance;
        if(gl.camera.distance < gl.nearPlane)
            gl.camera.distance = gl.nearPlane;
        else if(gl.camera.distance > gl.farPlane)
            gl.camera.distance = gl.farPlane;
    }

    e.preventDefault();
}

function handleClick(e)
{
}

function handleContextMenu(e)
{
    e.preventDefault(); // disable context menu
}



///////////////////////////////////////////////////////////////////////////////
// handle pointer events: input is PointerEvent object
///////////////////////////////////////////////////////////////////////////////
function handlePointerDown(pe)
{
    pe.preventDefault();    // prevent pointer event being delivered

    let offset = getElementOffset(this);    // get canvas offset
    gl.pointers.push(copyPointer(pe, offset));

    // remember down pointer and angles when pointer down
    if(gl.pointers.length == 1)
    {
        gl.camera.pointerAngle = gl.camera.angle.clone();
        gl.pointers.downs = []; // clear
        gl.pointers.downs.push(copyPointer(pe, offset));
        // handle right mouse button(0=left, 2=right)
        gl.pointers[0].button = pe.button;
    }
    else if(gl.pointers.length == 2)
    {
        // remember second pointer
        gl.pointers.downs.push(copyPointer(pe, offset));
    }
}

function handlePointerUp(pe)
{
    pe.preventDefault();    // prevent pointer event being delivered

    // get array index matching from gl.pointers
    let index = gl.pointers.findIndex(pointer => pointer.id == pe.pointerId);
    if(index >= 0) // found
    {
        gl.pointers.splice(index, 1);   // remove it
        gl.pointers.distance = 0;       // clear
    }
}

function handlePointerMove(pe)
{
    pe.preventDefault();    // prevent pointer event being delivered

    // get the current moving pointer and replace it in the array
    let offset = getElementOffset(this);    // get canvas offset
    let index = gl.pointers.findIndex(p => p.id == pe.pointerId);
    if(index >= 0)
    {
        // remember delta movement
        gl.pointers[index].delta = new Vector2((pe.pageX - offset.x) - gl.pointers[index].x, (pe.pageY - offset.y) - gl.pointers[index].y);
        // update
        gl.pointers[index].x = pe.pageX - offset.x;
        gl.pointers[index].y = pe.pageY - offset.y;
    }

    // if 2 pointers, perform zoom
    if(gl.pointers.length == 2)
    {
        const SCALE_ZOOM = 0.01;

        let d1 = gl.pointers[0].delta.normalize();
        let d2 = gl.pointers[1].delta.normalize();
        let dir = d1.add(d2).normalize();   // sum vector of 2 delta vectors
        let v = new Vector2(gl.pointers[1].x - gl.pointers[0].x, gl.pointers[1].y - gl.pointers[0].y);
        let dist = v.length();              // distance of 2 vectors

        // zoom camera if opposite direction
        let deltaDistance = 0;
        if(gl.pointers.distance > 0)
            deltaDistance = dist - gl.pointers.distance;
        gl.pointers.distance = dist;     // remember
        gl.camera.distance -= deltaDistance * gl.obj.radius * SCALE_ZOOM;
    }

    // if 1 down, perform rotate
    else if(gl.pointers.length == 1)
    {
        const SCALE_ROTATE = 0.01;
        const SCALE_SHIFT = 0.01;

        // shift if dragging right mouse button
        if(pe.pointerType == "mouse" && gl.pointers[0].button == 2)
        {
            let delta = gl.pointers[0].delta.normalize();
            delta = delta.scale(gl.obj.radius * SCALE_SHIFT);

            let l = new Vector3(-gl.matrixView.m[0], -gl.matrixView.m[4], -gl.matrixView.m[8]);
            let u = new Vector3(gl.matrixView.m[1], gl.matrixView.m[5], gl.matrixView.m[9]);
            let t = l.scale(delta.x).add(u.scale(delta.y));
            gl.camera.target.add(new Vector3(t.x, t.y, 0));
        }
        else
        {
            gl.camera.angle.x = gl.camera.pointerAngle.x + (gl.pointers[0].y - gl.pointers.downs[0].y) * SCALE_ROTATE;
            gl.camera.angle.y = gl.camera.pointerAngle.y + (gl.pointers[0].x - gl.pointers.downs[0].x) * SCALE_ROTATE;
        }

        let textOutlineEdges = document.getElementById("textOutlineEdges");
        textOutlineEdges.innerText = gl.outlineEdges.length;
    }
}

function handlePointerCancel(pe)
{
    gl.pointers.length = 0; // clear
    gl.pointers.distance = 0;
}

function handlePointerLeave(pe)
{
    gl.pointers.length = 0; // clear
    gl.pointers.distance = 0;
}

function copyPointer(pe, offset={x:0,y:0})
{
    // return pointer data
    return {id:pe.pointerId, x:pe.clientX - offset.x, y:pe.clientY - offset.y};
}



///////////////////////////////////////////////////////////////////////////////
// init OpenGL
///////////////////////////////////////////////////////////////////////////////
function initGL(gl)
{
    gl.clearColor(0.0, 0.0, 0.0, 0.0);
    gl.clearDepth(1.0);
    gl.enable(gl.DEPTH_TEST);   // enable depth test
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.CULL_FACE);    // enable culling backface
    gl.cullFace(gl.BACK);
    gl.enable(gl.BLEND);        // enable blend
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    // default light
    gl.light = new Light(0, 0, 1, 0);
    gl.light.color.set(1.0, 1.0, 1.0, 1.0);        // light color
    gl.light.attenuations.set(1, 0, 0); // attenuations (constant, linear, quad)
    log("    Light Position: " + gl.light.position);
    log("       Light Color: " + gl.light.color);
    log("Light Attenuations: " + gl.light.attenuations);
    log();

    // default material
    gl.material = new Material(0.7, 0.7, 0.7, 0.95); // with default diffuse
    gl.material.ambient.set(0.2, 0.2, 0.2, 1.0);
    gl.material.specular.set(0.0, 0.0, 0.0, 1);
    gl.material.shininess = 64;
    log("  Material Ambient: " + gl.material.ambient);
    log("  Material Diffuse: " + gl.material.diffuse);
    log(" Material Specualr: " + gl.material.specular);
    log("Material Shininess: " + gl.material.shininess);
    log();

    gl.nearPlane = 1;
    gl.farPlane = 1000;

    // init camera
    gl.camera = {};
    gl.camera.target = new Vector3(0, 0, 0);
    gl.camera.angle = new Vector2(0, 0);
    gl.camera.quaternion = new Quaternion();
    gl.camera.distance = CAMERA_Z;

    // init matrices
    handleResize();
    gl.matrixModel = new Matrix4();
    gl.matrixView = new Matrix4();
    gl.matrixModelView = gl.matrixView.clone().multiply(gl.matrixModel);
    gl.matrixModelViewProjection = gl.matrixProjection.clone().multiply(gl.matrixModelView);
}



///////////////////////////////////////////////////////////////////////////////
// init GLSL (shaders and programs)
///////////////////////////////////////////////////////////////////////////////
function initGLSL(gl)
{
    initVertexAttribArrays(gl); // enable all attribs

    // load shaders
    gl.shaderPrograms = {}; // associative array

    // load phong shader with 1 texture
    createShaderProgram(gl, "files/glsl/gles_phong.vert", "files/glsl/gles_phong.frag").then(program =>
    {
        gl.useProgram(program);
        // setup uniforms
        gl.uniform4fv(program.uniform.lightPosition, gl.light.getPosition());
        gl.uniform4fv(program.uniform.lightColor, gl.light.getColor());
        gl.uniform3fv(program.uniform.lightAttenuations, gl.light.getAttenuations());
        gl.uniform4fv(program.uniform.materialAmbient, gl.material.getAmbient());
        gl.uniform4fv(program.uniform.materialDiffuse, gl.material.getDiffuse());
        gl.uniform4fv(program.uniform.materialSpecular, gl.material.getSpecular());
        gl.uniform1f(program.uniform.materialShininess, gl.material.shininess);

        gl.shaderPrograms["phong"] = program;
    });

    // load flat shader
    createShaderProgram(gl, "files/glsl/gles_flatOffset.vert", "files/glsl/gles_flatOffset.frag").then(program =>
    {
        gl.useProgram(program);

        // setup uniforms
        gl.uniform4fv(program.uniform.materialDiffuse, new Float32Array([0,0,0,1]));
        gl.uniform1i(program.uniform.matrixComputed, false);
        gl.uniform1f(program.uniform.polygonOffset, -0.01);

        gl.shaderPrograms["flat"] = program;
    });

    createShaderProgram(gl, "files/glsl/gles_gooch.vert", "files/glsl/gles_gooch.frag").then(program =>
    {
        gl.useProgram(program);
        // setup uniforms
        gl.uniform4fv(program.uniform.lightPosition, gl.light.getPosition());
        gl.uniform4fv(program.uniform.materialDiffuse, gl.material.getDiffuse());
        gl.uniform1f(program.uniform.materialShininess, gl.material.shininess);
        gl.uniform4fv(program.uniform.warmColor, new Float32Array([0.7, 0.0, 0.0, 1]));
        gl.uniform4fv(program.uniform.coolColor, new Float32Array([0.0, 0.7, 0.0, 1]));
        gl.uniform1f(program.uniform.warmWeight, 0.8);
        gl.uniform1f(program.uniform.coolWeight, 0.8);

        gl.shaderPrograms["gooch"] = program;
    });
}



///////////////////////////////////////////////////////////////////////////////
// create vbo for OBJ model
///////////////////////////////////////////////////////////////////////////////
function initVBO(obj)
{
    log(obj);

    if(!gl.vbo)
        gl.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.vbo);
    let dataSize = obj.vertices.byteLength + obj.normals.byteLength; // total # of bytes
    gl.bufferData(gl.ARRAY_BUFFER, dataSize, gl.STATIC_DRAW);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, obj.vertices);
    gl.bufferSubData(gl.ARRAY_BUFFER, obj.vertices.byteLength, obj.normals);
    gl.vbo.normalOffset = obj.vertices.byteLength;

    if(!gl.ibo)
        gl.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, obj.indices, gl.STATIC_DRAW);
    gl.ibo.indexCount = obj.indices.length;

    // generate edges
    let vertices = ObjModel.toVertices(obj);
    gl.edges = Edge.generateEdges(vertices);
    gl.hardEdges = Edge.generateHardEdges(gl.edges, gl.edgeAngle);
    let hardEdgeVertices = Edge.toFloat32Array(gl.hardEdges);
    if(hardEdgeVertices.length > 0)
    {
        gl.vboHardEdge = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboHardEdge);
        gl.bufferData(gl.ARRAY_BUFFER, hardEdgeVertices, gl.STATIC_DRAW);
        gl.vboHardEdge.count = hardEdgeVertices.length / 3;
    }

    // compute outline edges
    gl.outlineEdges = Edge.generateOutlineEdges(gl.edges, gl.matrixView.getRotationMatrix());
    let outlineEdgeVertices = Edge.toFloat32Array(gl.outlineEdges);
    gl.vboOutlineEdge = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboOutlineEdge);
    gl.bufferData(gl.ARRAY_BUFFER, outlineEdgeVertices, gl.STATIC_DRAW);
    gl.vboOutlineEdge.count = outlineEdgeVertices.length / 3;

    // reset camera
    gl.camera.distance = obj.radius * 2.5;
    gl.camera.angle.set(0, 0);
    gl.camera.target.set(0, 0, 0);

    // print edge info
    let textEdges = document.getElementById("textEdges");
    textEdges.innerText = gl.edges.length;
    let textHardEdges = document.getElementById("textHardEdges");
    textHardEdges.innerText = gl.hardEdges.length;
    let textOutlineEdges = document.getElementById("textOutlineEdges");
    textOutlineEdges.innerText = gl.outlineEdges.length;
}



///////////////////////////////////////////////////////////////////////////////
// init DOM elements
///////////////////////////////////////////////////////////////////////////////
function initHtml()
{
    let comboModel = document.form1.comboModel;
    comboModel.selectedIndex = 0;
    comboModel.addEventListener("change", () =>
    {
        gl.obj.read("files/models/" + comboModel.value).then(obj =>
        {
            initVBO(obj);

            let rangeAngle = document.form1.rangeAngle;
            let edgeAngle = parseFloat(rangeAngle.value);
        });
    });

    let checkSurface = document.form1.checkSurface;
    checkSurface.checked = gl.surfaceVisible;
    checkSurface.addEventListener("change", () =>
    {
        gl.surfaceVisible = checkSurface.checked;
    });

    let checkOutline = document.form1.checkOutline;
    checkOutline.checked = gl.outlineVisible;
    checkOutline.addEventListener("change", () =>
    {
        gl.outlineVisible = checkOutline.checked;

        gl.outlineEdges = Edge.generateOutlineEdges(gl.edges, gl.matrixView.getRotationMatrix());
        let outlineEdgeVertices = Edge.toFloat32Array(gl.outlineEdges);
        gl.vboOutlineEdge = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboOutlineEdge);
        gl.bufferData(gl.ARRAY_BUFFER, outlineEdgeVertices, gl.STATIC_DRAW);
        gl.vboOutlineEdge.count = outlineEdgeVertices.length / 3;
    });

    let rangeAngle = document.form1.rangeAngle;
    rangeAngle.value = EDGE_ANGLE;
    rangeAngle.addEventListener("input", () =>
    {
        gl.edgeAngle = parseFloat(rangeAngle.value);
        let labelAngle = document.getElementById("labelAngle");
        labelAngle.innerText = rangeAngle.value;

        // recalculate hard edges
        let vertices = ObjModel.toVertices(gl.obj);
        gl.edges = Edge.generateEdges(vertices);
        gl.hardEdges = Edge.generateHardEdges(gl.edges, gl.edgeAngle);
        let hardEdgeVertices = Edge.toFloat32Array(gl.hardEdges);
        if(hardEdgeVertices.length > 0)
        {
            gl.vboHardEdge = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.vboHardEdge);
            gl.bufferData(gl.ARRAY_BUFFER, hardEdgeVertices, gl.STATIC_DRAW);
            gl.vboHardEdge.count = hardEdgeVertices.length / 3;
        }

        // diplay edge counts
        let textEdges = document.getElementById("textEdges");
        textEdges.innerText = gl.edges.length;
        let textHardEdges = document.getElementById("textHardEdges");
        textHardEdges.innerText = gl.hardEdges.length;
    });

    let textEdges = document.getElementById("textEdges");
    textEdges.innerText = "0";
    let textHardEdges = document.getElementById("textHardEdges");
    textHardEdges.innerText = "0";
    let textOutlineEdges = document.getElementById("textOutlineEdges");
    textOutlineEdges.innerText = gl.outlineEdges.length;
}


</script>

</head>

<body>

<div class="contentblock">

<div class="mainblock">
<canvas id="webglView" width="300" height="300">
</canvas>
<pre id="info">
<div id="fps">0 FPS</div>
</pre>
</div>

<div class="rightblock">
<h2>
WebGL Drawing Edges
</h2>

<form name="form1">
<label for="comboModel">Select OBJ: </label>
<select id="comboModel">
<option value="angle_block.obj" selected>Angle Block</option>
<option value="beveled_block.obj" >Beveled Block</option>
<option value="tongued_block.obj" >Tongued Block</option>
<option value="cube.obj" >Cube</option>
<option value="pipe2.obj" >Pipe</option>
<option value="pyramid.obj">Pyramid</option>
<option value="torus_hard.obj">Torus</option>
</select>
<br>
<br>

<label><input style="margin-bottom:10px;" type="checkbox" id="checkSurface">Fill Surface</label>
<br>
<label><input style="margin-bottom:10px;" type="checkbox" id="checkOutline">Show Outline Edges</label>
<br>

<span>Hard Edge Angle:</span>
<br>
<div class="flexbox">
<input class="flexcol1" type="range" name="rangeAngle" min="1" max="150" step="1" value="90"><label class="flexcol2" id="labelAngle" class="col3">90</label>
</div>
<br>

</form>

<div class="gridbox">
<div class="gridcol1">Total # of edges: </div><div class="gridcol2" id="textEdges">0</div>
<div class="gridcol1"># of hard edges: </div><div class="gridcol2" id="textHardEdges">0</div>
<div class="gridcol1"># of outline edges: </div><div class="gridcol2" id="textOutlineEdges">0</div>
</div>

</div>
<!-- end of rightblock -->

</div>
<!-- end of contentblock -->
</body>
</html>
